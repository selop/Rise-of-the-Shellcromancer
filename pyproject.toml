[project]
name = "rise-of-the-shellcromancer"
version = "0.1.0"
description = "A single-player PvE semi-idle incremental TUI game."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "textual>=6.0.0",
]

[project.scripts]
shellcromancer = "shellcromancer.app:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "textual-dev>=1.7.0",
]

[build-system]
requires = ["uv_build>=0.11.0,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "shellcromancer"

[tool.pytest.ini_options]
testpaths = ["tests"]
